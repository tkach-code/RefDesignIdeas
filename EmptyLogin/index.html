<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <form class="login-form">
    <input class="username-input" type="text" name="username" aria-label="Username" autocomplete="username">
    <input class="password-input" type="password" name="password" aria-label="Password" autocomplete="current-password">
    <button class="login-button" type="submit" aria-label="Login"></button>
  </form>
</body>
</html>
